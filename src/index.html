<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Fénix Triad</title>

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="En Fenix Triad, ofrecemos servicios de desarrollo de software y análisis de datos para empresas de todos los tamaños. Nuestra experiencia en soluciones personalizadas y tecnología avanzada garantiza resultados efectivos y medibles." />

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link
      rel="preload"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    /></noscript>

    <link
      rel="icon"
      type="image/x-icon"
      href="assets/images/logo-fenix-triad.svg" />
    <script src="//unpkg.com/alpinejs" defer></script>
  </head>
  <body class="black-background">
    <div class="loader-container">
      <span class="loader"></span>
    </div>

    <app-root></app-root>
    <script>
      // Script para ocultar el loading una vez que la aplicación esté lista
      window.addEventListener('load', function () {
        const loader = document.querySelector('.loader-container');
        if (loader) {
          loader.style.display = 'none';
        }
        document.body.classList.remove('black-background');
      });
    </script>
  </body>
</html>

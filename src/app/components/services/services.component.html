<div id="services" class="flex items-center text-center flex-col space-y-8 pb-5">
  <p class="font-azonix text-[42px] ">
    NUESTROS
    <span class="text-orange relative after:absolute after:bg-orange after:w-full after:h-[5px] after:left-0 after:top-full after:mt-2"
      >SERVICIOS</span>
  </p>
</div>
<div class="relative  ">
  <ngx-slick-carousel #slickModal="slick-carousel" 
  [config]="slideConfig">
    @for (slide of slides; track slide.img) {
    <div ngxSlickItem>
      <div class="relative h-[460px]">
        <img src="{{ slide.img }}" alt="" class="object-cover w-full h-full" />
        <div class="absolute inset-0 bg-gradient-to-b from-purple-opaque to-black opacity-10"></div>
        <div class="absolute inset-0 bottom-[20px] text-white text-center py-[20px] flex justify-center items-center">
        </div>
      </div>
    </div>
    }
  </ngx-slick-carousel>

  <div class="absolute inset-y-[40%] ml-16">
    <div class="relative elipse rounded-full w-[78px] h-[78px] flex items-center justify-center">

<section
  class="w-full h-screen flex items-center justify-center flex-col mt-20">
  <article class="flex items-center text-center flex-col space-y-8 pb-5">
    <p class="font-azonix text-[42px]">
      ¿LISTO PARA
      <span
        class="text-orange relative after:absolute after:bg-orange after:w-full after:h-[5px] after:left-0 after:top-full after:mt-2"
        >EMPEZAR?</span
      >
    </p>
    <p
      class="font-roboto 2xl:px-[15%] xl:px-[20%] lg:px-[15%] md:px-[6%] sm:px-[%] xs:px-[3%] text-xl">

    </p>
  </article>
  <div

    <div class="space-y-4">
      <p
        class="bg-purple-light text-white font-roboto font-bold text-2xl p-1 mr-[183px]">

      </p>
      <form

          id=""
          cols="35"
          rows="4"
